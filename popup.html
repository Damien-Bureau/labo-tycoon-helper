<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Labo Tycoon Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="32" height="32">
    <div>
      <h1>Labo Tycoon Helper</h1>
      <p class="version" id="version"></p>
    </div>
  </header>

  <label class="row master" for="all">
    <span>
      <b>Tout activer</b>
      <span class="hint" id="allHint">…</span>
    </span>
    <input type="checkbox" id="all" role="switch">
    <span class="switch" aria-hidden="true"></span>
  </label>

  <div class="group">
    <label class="row" for="indicators">
      <span>
        <b>Afficher les indicateurs</b>
        <span class="hint">Colonnes à droite des prix et machines restantes</span>
      </span>
      <input type="checkbox" id="indicators" role="switch">
      <span class="switch" aria-hidden="true"></span>
    </label>
    <label class="row" for="rings">
      <span>
        <b>Afficher les contours des boutons d'achat</b>
        <span class="hint">Progression de la cagnotte vers le prix</span>
      </span>
      <input type="checkbox" id="rings" role="switch">
      <span class="switch" aria-hidden="true"></span>
    </label>
    <label class="row" for="stats">
      <span>
        <b>Afficher les stats supplémentaires</b>
        <span class="hint">Hors ligne max et café, sous les stats du jeu</span>
      </span>
      <input type="checkbox" id="stats" role="switch">
      <span class="switch" aria-hidden="true"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
